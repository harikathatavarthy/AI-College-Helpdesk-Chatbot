<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College AI Helpdesk</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

body{

    background:#eef3f8;

}

.selection-container{

    width:90%;

    margin:40px auto;

}

.selection-header{

    background:#0b3d91;

    color:white;

    padding:30px;

    border-radius:12px;

    text-align:center;

    box-shadow:0 5px 15px rgba(0,0,0,.15);

}

.selection-header h1{

    margin-bottom:10px;

}

.selection-header p{

    font-size:18px;

}

.card-grid{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

    gap:25px;

    margin-top:35px;

}

.card{

    background:white;

    border-radius:12px;

    padding:25px;

    box-shadow:0 5px 15px rgba(0,0,0,.12);

    transition:.3s;

    text-align:center;

}

.card:hover{

    transform:translateY(-8px);

}

.card h2{

    color:#0b3d91;

    margin-bottom:15px;

}

.card p{

    color:#555;

    margin-bottom:10px;

}

.card button{

    margin-top:20px;

    background:#0b3d91;

    color:white;

    border:none;

    padding:12px 22px;

    border-radius:8px;

    cursor:pointer;

    transition:.3s;

}

.card button:hover{

    background:#082b66;

}

.logout{

    text-align:right;

    margin-top:20px;

}

.logout a{

    text-decoration:none;

}

.logout button{

    background:#dc3545;

    color:white;

    border:none;

    padding:10px 20px;

    border-radius:8px;

    cursor:pointer;

}

.logout button:hover{

    background:#b52b38;

}

    </style>

</head>

<body>

<div class="selection-container">

    <div class="logout">

        <a href="/logout">

            <button>Logout</button>

        </a>

    </div>

    <div class="selection-header">

        <h1>🎓 Multi-College AI Helpdesk</h1>

        <p>

            Welcome <b>{{ session["user"] }}</b> 👋

            <br><br>

            Select a college below to start chatting with its AI Assistant.

        </p>

    </div>

    <div class="card-grid">

        {% for key, college in colleges.items() %}

        <div class="card">

            <h2>{{ college.name }}</h2>

            <p>📍 {{ college.location }}</p>

            <p>🏅 NAAC : {{ college.naac }}</p>

            <p>✅ NBA : {{ college.nba }}</p>

            <form action="/college/{{ key }}" method="GET">

                <button>

                    Open AI Assistant

                </button>

            </form>

        </div>

        {% endfor %}

    </div>

</div>

</body>

</html>
