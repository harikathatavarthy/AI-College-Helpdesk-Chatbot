<!DOCTYPE html>
<html>

<head>

    <title>College AI Helpdesk - Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

    <style>

body{

    background:#eef3f8;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

}

.login-box{

    width:420px;

    background:white;

    padding:35px;

    border-radius:12px;

    box-shadow:0 5px 15px rgba(0,0,0,.15);

}

.login-box h1{

    color:#0b3d91;

    text-align:center;

    margin-bottom:25px;

}

.login-box input{

    width:100%;

    padding:14px;

    margin:10px 0;

    border:1px solid #ccc;

    border-radius:8px;

    font-size:15px;

}

.login-box button{

    width:100%;

    padding:14px;

    background:#0b3d91;

    color:white;

    border:none;

    border-radius:8px;

    font-size:16px;

    cursor:pointer;

}

.login-box button:hover{

    background:#082c68;

}

.message{

    text-align:center;

    color:red;

    margin-bottom:15px;

}

.bottom{

    text-align:center;

    margin-top:20px;

}

.bottom a{

    text-decoration:none;

    color:#0b3d91;

    font-weight:bold;

}

    </style>

</head>

<body>

<div class="login-box">

<h1>🎓 College AI Helpdesk</h1>

{% if message %}

<div class="message">

{{ message }}

</div>

{% endif %}

<form method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button>

Login

</button>

</form>

<div class="bottom">

Don't have an account?

<br><br>

<a href="/register">

Create Account

</a>

</div>

</div>

</body>

</html>
