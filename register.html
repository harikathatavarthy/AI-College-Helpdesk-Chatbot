<!DOCTYPE html>
<html>

<head>

<title>Register</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<style>

body{

background:#eef3f8;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.box{

width:450px;

background:white;

padding:35px;

border-radius:12px;

box-shadow:0 5px 15px rgba(0,0,0,.15);

}

.box h1{

text-align:center;

color:#0b3d91;

margin-bottom:20px;

}

.box input{

width:100%;

padding:14px;

margin:10px 0;

border:1px solid #ccc;

border-radius:8px;

font-size:15px;

}

.box button{

width:100%;

padding:14px;

background:#0b3d91;

color:white;

border:none;

border-radius:8px;

font-size:16px;

cursor:pointer;

}

.box button:hover{

background:#082c68;

}

.message{

text-align:center;

color:red;

margin-bottom:15px;

}

.bottom{

text-align:center;

margin-top:20px;

}

.bottom a{

text-decoration:none;

color:#0b3d91;

font-weight:bold;

}

</style>

</head>

<body>

<div class="box">

<h1>Create Account</h1>

{% if message %}

<div class="message">

{{ message }}

</div>

{% endif %}

<form method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="email"
name="email"
placeholder="Email"
required>

<input
type="text"
name="mobile"
placeholder="Mobile Number"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button>

Register

</button>

</form>

<div class="bottom">

Already Registered?

<br><br>

<a href="/login">

Login Here

</a>

</div>

</div>

</body>

</html>
